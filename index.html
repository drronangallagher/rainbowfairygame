    ctx.fillStyle = "rgba(255,255,255,.76)";
    ctx.beginPath();
    ctx.arc(-38, 12, 27, 0, Math.PI * 2);
    ctx.arc(-7, -4, 38, 0, Math.PI * 2);
    ctx.arc(31, 10, 30, 0, Math.PI * 2);
    ctx.arc(62, 18, 21, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawRainbow(cx, cy, radius, width) {
    const colors = ["#f54f63", "#ff9d38", "#ffe05b", "#62d06e", "#5db7ff", "#6e64e7", "#b55ed5"];
    ctx.save();
    ctx.lineCap = "round";
    for (let i = 0; i < colors.length; i++) {
      ctx.strokeStyle = colors[i];
      ctx.lineWidth = width / colors.length + 2;
      ctx.beginPath();
      ctx.arc(cx, cy, radius - i * (width / colors.length), Math.PI, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHeart(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(-12, -4, -15, 8, 0, 19);
    ctx.bezierCurveTo(15, 8, 12, -4, 0, 5);
    ctx.fill();
    ctx.restore();
  }

  function drawStar(x, y, r1, r2) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const r = i % 2 === 0 ? r1 : r2;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawSparkles(x, y, w, h, count, seed) {
    ctx.save();
    for (let i = 0; i < count; i++) {
      const px = x + ((Math.sin(i * 91.17 + seed * 4.1) * 0.5 + 0.5) * w);
      const py = y + ((Math.sin(i * 37.73 + seed * 9.2) * 0.5 + 0.5) * h);
      const pulse = 0.45 + 0.55 * Math.sin(frame * 0.025 + i);
      ctx.globalAlpha = 0.25 + pulse * 0.6;
      ctx.fillStyle = "white";
      drawStar(px, py, 3 + pulse * 3, 1.5 + pulse);
    }
    ctx.restore();
  }

  function drawStars(count) {
    ctx.save();
    for (let i = 0; i < count; i++) {
      const x = ((Math.sin(i * 97.1) * 0.5 + 0.5) * W);
      const y = 50 + ((Math.sin(i * 53.3) * 0.5 + 0.5) * 250);
      const pulse = 0.55 + 0.45 * Math.sin(frame * 0.04 + i);
      ctx.globalAlpha = 0.3 + pulse * 0.6;
      ctx.fillStyle = i % 5 === 0 ? "#ffeaa9" : "white";
      drawStar(x, y, 2 + pulse * 2, 1 + pulse * 0.7);
    }
    ctx.restore();
  }

  function drawMoon(x, y, r) {
    ctx.save();
    ctx.fillStyle = "rgba(255,250,223,0.88)";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(x + 18, y - 8, r * 0.88, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
  }

  function drawTreeSilhouette(x, y, scale, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = color;
    ctx.fillRect(-10, -60, 20, 60);
    ctx.beginPath(); ctx.arc(0, -86, 46, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-28, -70, 34, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(26, -70, 34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawOrchardSilhouette(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "rgba(142, 99, 46, 0.24)";
    ctx.fillRect(-8, -60, 16, 60);
    ctx.fillStyle = "rgba(91, 163, 86, 0.26)";
    ctx.beginPath(); ctx.arc(0, -82, 44, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawSunflowerSilhouette(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.strokeStyle = "rgba(109, 150, 63, 0.30)";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -80); ctx.stroke();
    ctx.fillStyle = "rgba(248, 217, 63, 0.28)";
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI * 2 / 10;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 18, -82 + Math.sin(a) * 18, 10, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "rgba(132, 95, 39, 0.30)";
    ctx.beginPath(); ctx.arc(0, -82, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawHillFlowerPatch(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI * 2 / 6;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 16, Math.sin(a) * 10, 7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#ffd46c";
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawOrangeTree(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#87582d";
    ctx.fillRect(-10, -60, 20, 60);
    ctx.fillStyle = "#58a65d";
    ctx.beginPath(); ctx.arc(0, -86, 42, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-28, -74, 30, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(28, -74, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff9b33";
    [[-18,-88], [16,-93], [0,-73], [22,-68], [-22,-65]].forEach(p => {
      ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  function drawSunflower(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.strokeStyle = "#5f973e";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -74); ctx.stroke();
    ctx.fillStyle = "#7bc56a";
    ctx.beginPath(); ctx.ellipse(-10, -35, 12, 5, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, -48, 12, 5, 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd839";
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI * 2 / 12;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 16, -84 + Math.sin(a) * 16, 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#8c5c24";
    ctx.beginPath(); ctx.arc(0, -84, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawTree(x, y, scale, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#70502e";
    ctx.fillRect(-12, -70, 24, 70);
    ctx.fillStyle = "#4caf64";
    ctx.beginPath(); ctx.arc(0, -102, 50, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-35, -84, 36, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(38, -84, 36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    [[-20,-109],[19,-98],[0,-72]].forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  }

  function drawShellCluster(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#fff1db";
    ctx.beginPath(); ctx.moveTo(-22, 0); ctx.quadraticCurveTo(-14, -18, -4, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.quadraticCurveTo(18, -20, 28, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f6c0da";
    ctx.beginPath(); ctx.arc(2, -5, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawCrystalCluster(x, y, scale, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = color;
    [[0,-24,16],[18,-16,12],[-16,-12,10]].forEach(c => {
      ctx.beginPath();
      ctx.moveTo(c[0], c[1]); ctx.lineTo(c[0] + c[2] / 2, 0); ctx.lineTo(c[0], 6); ctx.lineTo(c[0] - c[2] / 2, 0); ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.beginPath(); ctx.moveTo(-2,-19); ctx.lineTo(1,-6); ctx.lineTo(-2,1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawMoonFlowers(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#67995d";
    ctx.fillRect(-2, -18, 4, 18);
    ctx.fillStyle = color;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI * 2 / 6;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 8, -20 + Math.sin(a) * 8, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#fff0a4";
    ctx.beginPath(); ctx.arc(0, -20, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawTulip(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#56a24d";
    ctx.fillRect(-2, -14, 4, 14);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(8, -14); ctx.lineTo(0, -10); ctx.lineTo(-8, -14); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawMiniPumpkin(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(0, -8, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#6b8e42";
    ctx.fillRect(-1.5, -20, 3, 8);
    ctx.restore();
  }

  function drawDaisy(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#54a04c";
    ctx.fillRect(-2, -18, 4, 18);
    ctx.fillStyle = "white";
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI * 2 / 8;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 7, -22 + Math.sin(a) * 7, 5, 2.6, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, -22, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawFernLeaf(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -20); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const yy = -5 - i * 4;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(8, yy - 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, yy - 1); ctx.lineTo(-8, yy - 4); ctx.stroke();
    }
    ctx.restore();
  }

  function drawSeaFlower(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, -12, 5, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 8, -12 + Math.sin(a) * 8, 5, 3, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawCrystalBud(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(8, -8); ctx.lineTo(0, 0); ctx.lineTo(-8, -8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawNightBloom(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI * 2 / 6;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 7, -15 + Math.sin(a) * 7, 5, 2.5, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#fff2a0";
    ctx.beginPath(); ctx.arc(0, -15, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawSmallButterfly(x, y, fairyIndex) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = fairies[fairyIndex].color;
    ctx.beginPath(); ctx.ellipse(-6, 0, 7, 10, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, 0, 7, 10, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#5a436f";
    ctx.fillRect(-1, -8, 2, 16);
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(33, now - lastTime || 16.67);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  updateButtonLabels();
  canvas.focus();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
