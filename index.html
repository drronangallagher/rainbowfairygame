<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#15142d" />
<title>Rainbow Magic Fairy Hunt - Deluxe</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(26, 22, 64, 0.86);
    --panel2: rgba(54, 39, 106, 0.92);
    --soft: rgba(255,255,255,0.15);
    --text: #fffafc;
    --textDim: rgba(255,255,255,0.82);
    --gold: #ffe176;
    --pink: #ff72b2;
    --violet: #8467d7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at top, #45398c 0%, #15142d 60%, #090913 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
  }
  body {
    display: grid;
    place-items: center;
    padding: 14px;
    overflow: hidden;
  }
  #wrap {
    width: min(100%, 1320px);
    position: relative;
  }
  canvas {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    border-radius: 24px;
    box-shadow: 0 28px 80px rgba(0,0,0,0.46);
    background: #89dbff;
    outline: none;
  }
  #uiBar {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 3;
  }
  .uiBtn {
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: rgba(13, 17, 42, 0.72);
    color: white;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .uiBtn:hover { background: rgba(39, 46, 88, 0.88); }
  #tip {
    position: absolute;
    left: 14px;
    bottom: 12px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: end;
    font-size: 12px;
    color: rgba(255,255,255,.82);
    text-shadow: 0 1px 3px #000;
    pointer-events: none;
    z-index: 2;
  }
  #tip span {
    background: rgba(7, 9, 30, .42);
    padding: 7px 10px;
    border-radius: 999px;
    backdrop-filter: blur(5px);
  }
  #tip strong { color: white; }
  @media (max-width: 720px) {
    body { padding: 0; background: #111; }
    canvas { border-radius: 0; }
    #tip { display: none; }
    #uiBar { top: 8px; right: 8px; }
    .uiBtn { padding: 8px 11px; font-size: 12px; }
  }


  /* Touchscreen controls rebuilt from the known-good tablet layout */
  #touchControls {
    display: none;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 5px 24px max(5px, env(safe-area-inset-bottom));
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #touchStick {
    --stick-x: 0px;
    --stick-y: 0px;
    width: 208px;
    height: 208px;
    flex: 0 0 208px;
    position: relative;
    border-radius: 50%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 31%, transparent 32%),
      radial-gradient(circle at 50% 50%, rgba(91,69,151,.94) 0 66%, rgba(31,25,74,.97) 67% 100%);
    border: 2px solid rgba(255,255,255,.24);
    box-shadow: inset 0 0 0 7px rgba(255,255,255,.035), 0 8px 24px rgba(0,0,0,.30);
  }
  .touchDir {
    position: absolute;
    width: 62px;
    height: 62px;
    display: grid;
    place-items: center;
    border-radius: 20px;
    background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.72);
    font: 950 29px/1 system-ui, sans-serif;
    pointer-events: none;
  }
  .touchDir.active { background: rgba(255,225,118,.86); color: #36265f; transform: scale(1.05); }
  .touchDir.up { left: 73px; top: 7px; }
  .touchDir.down { left: 73px; bottom: 7px; }
  .touchDir.left { left: 7px; top: 73px; }
  .touchDir.right { right: 7px; top: 73px; }
  #touchKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 78px;
    height: 78px;
    margin: -39px 0 0 -39px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #ff8fc5, #896eff 72%);
    border: 3px solid rgba(255,255,255,.72);
    color: white;
    font-size: 34px;
    box-shadow: 0 7px 20px rgba(0,0,0,.34), inset 0 2px 5px rgba(255,255,255,.34);
    transform: translate(var(--stick-x), var(--stick-y));
    transition: transform .08s ease-out;
    pointer-events: none;
    z-index: 3;
  }
  #touchStick.tracking #touchKnob { transition: none; }
  .touchActions {
    display: grid;
    grid-template-columns: 86px 106px;
    grid-template-rows: 86px 106px;
    gap: 10px 14px;
    align-items: end;
    justify-items: center;
    margin-left: auto;
  }
  .touchAction {
    appearance: none;
    width: 86px;
    height: 86px;
    min-height: 86px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.62);
    color: white;
    font-family: inherit;
    font-weight: 900;
    text-shadow: 0 2px 3px rgba(0,0,0,.45);
    box-shadow: 0 7px 22px rgba(0,0,0,.32), inset 0 0 18px rgba(255,255,255,.12);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
  }
  .touchAction strong { display:block; font-size:27px; line-height:28px; }
  .touchAction span { display:block; font-size:9px; line-height:12px; margin-top:3px; letter-spacing:.2px; }
  .touchAction.pressed { transform: scale(.91); filter: brightness(1.2); }
  #touchMountBtn { background: rgba(73,165,235,.84); grid-column:1; grid-row:2; }
  #touchThrowBtn { background: rgba(248,190,55,.88); grid-column:1; grid-row:1; }
  #touchJumpBtn { width:106px; height:106px; min-height:106px; background: rgba(235,76,100,.86); grid-column:2; grid-row:2; }
  #touchJumpBtn strong { font-size:34px; }
  #touchPauseBtn { width:58px; height:58px; min-height:58px; background: rgba(47,42,88,.88); grid-column:2; grid-row:1; align-self:center; }
  #touchPauseBtn strong { font-size:21px; }

  body.touch-capable {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    padding: 0;
    place-items: stretch;
    overscroll-behavior: none;
  }
  body.touch-capable #wrap {
    width: 100%;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 3px;
    padding: 4px max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
  }
  body.touch-capable canvas {
    grid-row: 1;
    width: auto;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    justify-self: center;
    align-self: center;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    touch-action: none;
  }
  body.touch-capable #touchControls { display: flex; grid-row: 2; }
  body.touch-capable #tip { display: none; }
  body.touch-capable #uiBar { top: 8px; right: max(8px, env(safe-area-inset-right)); }

  @media (max-height: 700px) {
    body.touch-capable #touchControls { padding: 2px 14px max(2px, env(safe-area-inset-bottom)); gap: 12px; }
    body.touch-capable #touchStick { width: 160px; height: 160px; flex-basis: 160px; }
    body.touch-capable .touchDir { width: 48px; height: 48px; font-size: 22px; border-radius: 15px; }
    body.touch-capable .touchDir.up { left: 56px; top: 4px; }
    body.touch-capable .touchDir.down { left: 56px; bottom: 4px; }
    body.touch-capable .touchDir.left { left: 4px; top: 56px; }
    body.touch-capable .touchDir.right { right: 4px; top: 56px; }
    body.touch-capable #touchKnob { width: 60px; height: 60px; margin: -30px 0 0 -30px; font-size: 26px; }
    body.touch-capable .touchActions { grid-template-columns: 70px 88px; grid-template-rows: 70px 88px; gap: 7px 10px; }
    body.touch-capable .touchAction { width:70px; height:70px; min-height:70px; }
    body.touch-capable #touchJumpBtn { width:88px; height:88px; min-height:88px; }
    body.touch-capable #touchPauseBtn { width:50px; height:50px; min-height:50px; }
  }

</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Rainbow Magic Fairy Hunt game"></canvas>
  <div id="uiBar">
    <button id="soundBtn" class="uiBtn" type="button">SFX: On</button>
    <button id="musicBtn" class="uiBtn" type="button">Music: On</button>
    <button id="fsBtn" class="uiBtn" type="button">Full Screen</button>
  </div>
  <div id="tip">
    <span><strong>Keyboard</strong> - A/D move, Up/Down ladders, Space jump, E unicorn, Q snowball, P pause, F full screen</span>
    <span id="padStatus"><strong>Controller</strong> - B jump, X unicorn, Y snowball</span>
  </div>

  <div id="touchControls" aria-label="Touch controls">
    <div id="touchStick" role="group" aria-label="Movement and climbing joystick">
      <div class="touchDir up" data-dir="up" aria-hidden="true">▲</div>
      <div class="touchDir left" data-dir="left" aria-hidden="true">◀</div>
      <div class="touchDir right" data-dir="right" aria-hidden="true">▶</div>
      <div class="touchDir down" data-dir="down" aria-hidden="true">▼</div>
      <div id="touchKnob" aria-hidden="true">✦</div>
    </div>
    <div class="touchActions">
      <button id="touchThrowBtn" class="touchAction" type="button" aria-label="Pick up or throw snowball"><strong>Y</strong><span>SNOWBALL</span></button>
      <button id="touchPauseBtn" class="touchAction" type="button" aria-label="Pause or resume"><strong>Ⅱ</strong><span>PAUSE</span></button>
      <button id="touchMountBtn" class="touchAction" type="button" aria-label="Mount or dismount unicorn"><strong>X</strong><span>UNICORN</span></button>
      <button id="touchJumpBtn" class="touchAction" type="button" aria-label="Jump or confirm"><strong>B</strong><span>JUMP / OK</span></button>
    </div>
  </div>

</div>

  function lerp(a, b, t) { return a + (b - a) * t; }
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function tone(freq, duration = 0.08, type = "sine", volume = 0.04, slide = 0) {
    if (!soundOn && type !== "music") return;
    initAudio();
    if (!audioCtx || !freq) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(2200, now);
    osc.type = type === "music" ? "square" : type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, now + duration);
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(filter).connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  function playSfx(freq, duration, type, volume, slide) {
    if (!soundOn) return;
    tone(freq, duration, type, volume, slide);
  }

  function jingle() {
    if (!soundOn) return;
    [523, 659, 784, 988, 1175].forEach((f, i) => setTimeout(() => playSfx(f, 0.12, "triangle", 0.032), i * 85));
  }

  function goblinFart() {
    if (!soundOn) return;
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(115 + Math.random() * 18, now);
    osc.frequency.exponentialRampToValueAtTime(42, now + 0.24);
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(520, now);
    filter.frequency.exponentialRampToValueAtTime(150, now + 0.24);
    gain.gain.setValueAtTime(0.075, now);
    gain.gain.linearRampToValueAtTime(0.115, now + 0.045);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.31);
    osc.connect(filter).connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.28);

    const pop = audioCtx.createOscillator();
    const popGain = audioCtx.createGain();
    pop.type = "square";
    pop.frequency.setValueAtTime(82, now + 0.04);
    pop.frequency.exponentialRampToValueAtTime(52, now + 0.13);
    popGain.gain.setValueAtTime(0.046, now + 0.04);
    popGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
    pop.connect(popGain).connect(audioCtx.destination);
    pop.start(now + 0.04);
    pop.stop(now + 0.15);
  }

    if (!soundOn || !("speechSynthesis" in window)) return;

  function updateMusic(dt) {
    const theme = getSongName();
    if (theme !== lastMusicTheme) {
      musicTimer = 0;
      musicStep = 0;
      lastMusicTheme = theme;
    }
    if (!musicOn) return;
    initAudio();
    if (!audioCtx) return;
    musicTimer += dt;
    const stepLength = theme === "boss" ? 150 : 175;
    while (musicTimer >= stepLength) {
      musicTimer -= stepLength;
      const song = songs[theme] || songs.title;
      const i = musicStep % song.lead.length;
      const lf = song.lead[i];
      const bf = song.bass[i];
      if (lf) tone(lf, theme === "boss" ? 0.1 : 0.125, "music", 0.013, 0);
      if (bf) tone(bf, theme === "boss" ? 0.14 : 0.17, "triangle", 0.010, 0);
      musicStep++;
    }
  }

  function makeLevel(index) {

    for (const [a,b] of gaps) {

    const patterns = [
      [[495,420,365,470,410,500],[455,385,500,350,430,475],[500,440,375,420,330,485]],

      [[475,360,430,500,385,340],[410,335,470,390,500,355],[500,430,350,405,330,475]],
      [[500,415,355,470,390,330],[455,350,500,405,335,470],[385,500,340,445,370,490]],

  function findGroundPlatformAt(platforms, x, fallbackY) {
    let best = { y: fallbackY };
    for (const p of platforms) {
      if (x >= p.x && x <= p.x + p.w && p.y <= fallbackY && p.y > best.y - 300) {
        if (p.h > 40 || p.y > best.y) best = p;
      }
    }
    return best;
  }

  function groundYAtX(x) {
    if (!level || !level.platforms) return GROUND_Y;
    const grounds = level.platforms.filter(p => p.h > 40 && x >= p.x && x <= p.x + p.w);
    if (!grounds.length) return GROUND_Y;
    return Math.min(...grounds.map(g => g.y));
  }

  function safeGroundX(x) {
    if (!level || !level.platforms) return clamp(x, 50, LEVEL_WIDTH - 80);
    const grounds = level.platforms.filter(p => p.h > 40);
    const clamped = clamp(x, 50, LEVEL_WIDTH - 80);
    const onGround = grounds.find(g => clamped >= g.x + 35 && clamped <= g.x + g.w - 35);
    if (onGround) return clamped;
    let bestX = clamped;
    let bestDist = Infinity;
    for (const g of grounds) {
      const candidate = clamp(clamped, g.x + 45, g.x + g.w - 45);
      const d = Math.abs(candidate - clamped);
      if (d < bestDist) { bestDist = d; bestX = candidate; }
    }
    return bestX;
  }

  function resetTouchStick() {
    touchInput.left = touchInput.right = touchInput.up = touchInput.down = false;
    if (touchStick) {
      touchStick.classList.remove("tracking");
      touchStick.style.setProperty("--stick-x", "0px");
      touchStick.style.setProperty("--stick-y", "0px");
      touchStick.querySelectorAll(".touchDir").forEach(el => el.classList.remove("active"));
    }
  }

  function updateTouchStick(clientX, clientY) {
    if (!touchStick) return;
    const r = touchStick.getBoundingClientRect();
    const rawX = clientX - (r.left + r.width / 2);
    const rawY = clientY - (r.top + r.height / 2);
    const radius = Math.max(1, Math.min(r.width, r.height) / 2);
    const nx = rawX / radius;
    const ny = rawY / radius;
    const magnitude = Math.hypot(nx, ny);
    const maxKnob = Math.min(r.width, r.height) * 0.28;
    const rawMagnitude = Math.hypot(rawX, rawY);
    const knobScale = rawMagnitude > 0 ? Math.min(1, maxKnob / rawMagnitude) : 0;
    touchStick.style.setProperty("--stick-x", `${(rawX * knobScale).toFixed(1)}px`);
    touchStick.style.setProperty("--stick-y", `${(rawY * knobScale).toFixed(1)}px`);

    const wasLeft = touchInput.left;
    const wasRight = touchInput.right;
    if (magnitude < TOUCH_DEAD_ZONE) {
      touchInput.left = touchInput.right = touchInput.up = touchInput.down = false;
    } else {
      touchInput.left = nx < -TOUCH_AXIS_THRESHOLD;
      touchInput.right = nx > TOUCH_AXIS_THRESHOLD;
      touchInput.up = ny < -TOUCH_AXIS_THRESHOLD;
      touchInput.down = ny > TOUCH_AXIS_THRESHOLD;
    }
    if (touchInput.left && !wasLeft) touchPressed.left = true;
    if (touchInput.right && !wasRight) touchPressed.right = true;
    touchStick.querySelectorAll(".touchDir").forEach(el => {
      el.classList.toggle("active", !!touchInput[el.dataset.dir]);
    });
  }

  if (touchStick) {
    if ("PointerEvent" in window) {
      touchStick.addEventListener("pointerdown", e => {
        if (!touchCapable && e.pointerType === "mouse") return;
        e.preventDefault(); initAudio();
        touchStickPointer = e.pointerId;
        touchStick.classList.add("tracking");
        try { touchStick.setPointerCapture(e.pointerId); } catch (_) {}
        updateTouchStick(e.clientX, e.clientY);
      });
      touchStick.addEventListener("pointermove", e => {
        if (e.pointerId !== touchStickPointer) return;
        e.preventDefault(); updateTouchStick(e.clientX, e.clientY);
      });
      const endStick = e => {
        if (e.pointerId !== touchStickPointer) return;
        e.preventDefault(); touchStickPointer = null; resetTouchStick();
      };
      touchStick.addEventListener("pointerup", endStick);
      touchStick.addEventListener("pointercancel", endStick);
      touchStick.addEventListener("lostpointercapture", () => { touchStickPointer = null; resetTouchStick(); });
    } else {
      touchStick.addEventListener("touchstart", e => {

        const t=Array.from(e.changedTouches).find(t=>t.identifier===touchStickPointer); if(!t)return;

  function bindTouchButton(button, key) {
    if (!button) return;
    let pointerId = null;
    const press = () => { initAudio(); touchInput[key] = true; touchPressed[key] = true; button.classList.add("pressed"); };
    const release = () => { touchInput[key] = false; button.classList.remove("pressed"); };
    if ("PointerEvent" in window) {
      button.addEventListener("pointerdown", e => {
        if (!touchCapable && e.pointerType === "mouse") return;
        e.preventDefault(); e.stopPropagation(); pointerId=e.pointerId; press();
        try { button.setPointerCapture(e.pointerId); } catch (_) {}
      });
      button.addEventListener("pointerup", e => { if(pointerId!==null && e.pointerId!==pointerId)return; e.preventDefault(); pointerId=null; release(); });
      button.addEventListener("pointercancel", () => { pointerId=null; release(); });
      button.addEventListener("lostpointercapture", () => { pointerId=null; release(); });
    } else {
      button.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); press(); }, {passive:false});

  bindTouchButton(touchJumpBtn, "jump");

  function getInput() {
    let left = keys.has("ArrowLeft") || keys.has("KeyA") || touchInput.left;
    let right = keys.has("ArrowRight") || keys.has("KeyD") || touchInput.right;
    let up = keys.has("ArrowUp") || keys.has("KeyW") || touchInput.up;
    let down = keys.has("ArrowDown") || keys.has("KeyS") || touchInput.down;
    let jumpHeld = keys.has("Space") || keys.has("KeyZ") || touchInput.jump;
    let padJump = false;
    let padStart = false;
    let padConfirm = false;
    let padLeft = false;
    let padRight = false;
    let padUp = false;
    let padDown = false;
    let padFs = false;
    let padMount = false;
    let padThrow = false;

    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = Array.from(pads || []).find(Boolean);
    if (gp) {
      gamepadName = gp.id || "Gamepad";
      padStatus.innerHTML = `<strong>Controller</strong> - ${gamepadName.slice(0, 30)} | B jump | X unicorn | Y snowball`;
      const ax = Math.abs(gp.axes[0] || 0) > 0.18 ? gp.axes[0] : 0;
      const ay = Math.abs(gp.axes[1] || 0) > 0.18 ? gp.axes[1] : 0;
      padLeft = ax < -0.25 || !!gp.buttons[14]?.pressed;
      padRight = ax > 0.25 || !!gp.buttons[15]?.pressed;
      padUp = ay < -0.30 || !!gp.buttons[12]?.pressed;
      padDown = ay > 0.30 || !!gp.buttons[13]?.pressed;
      padJump = !!gp.buttons[0]?.pressed || !!gp.buttons[1]?.pressed;
      padConfirm = !!gp.buttons[0]?.pressed || !!gp.buttons[1]?.pressed;
      padMount = !!gp.buttons[2]?.pressed;
      padThrow = !!gp.buttons[3]?.pressed;
      padStart = !!gp.buttons[9]?.pressed;
      padFs = !!gp.buttons[8]?.pressed;
      left ||= padLeft;
      right ||= padRight;
      up ||= padUp;
      down ||= padDown;
      jumpHeld ||= padJump;
    }

    const touchJumpPressed = touchPressed.jump || (touchInput.jump && !previousTouch.jump);
    const touchMountPressed = touchPressed.mount || (touchInput.mount && !previousTouch.mount);
    const touchThrowPressed = touchPressed.throw || (touchInput.throw && !previousTouch.throw);
    const touchPausePressed = touchPressed.pause || (touchInput.pause && !previousTouch.pause);
    const touchLeftPressed = touchPressed.left || (touchInput.left && !previousTouch.left);
    const touchRightPressed = touchPressed.right || (touchInput.right && !previousTouch.right);
    const jumpPressed = (keysPressed.has("Space") || keysPressed.has("KeyZ")) || (padJump && !previousPad.jump) || touchJumpPressed;
    const mountPressed = keysPressed.has("KeyE") || (padMount && !previousPad.mount) || touchMountPressed;
    const throwPressed = keysPressed.has("KeyQ") || (padThrow && !previousPad.throw) || touchThrowPressed;
    const confirmPressed = keysPressed.has("Enter") || (padConfirm && !previousPad.confirm) || touchJumpPressed;
    const startPressed = keysPressed.has("KeyP") || (padStart && !previousPad.start) || touchPausePressed;
    const menuLeftPressed = keysPressed.has("ArrowLeft") || keysPressed.has("KeyA") || (padLeft && !previousPad.left) || touchLeftPressed;
    const menuRightPressed = keysPressed.has("ArrowRight") || keysPressed.has("KeyD") || (padRight && !previousPad.right) || touchRightPressed;
    const fullscreenPressed = keysPressed.has("KeyF") || (padFs && !previousPad.fullscreen);

    previousPad = { jump: padJump, start: padStart, left: padLeft, right: padRight, confirm: padConfirm, fullscreen: padFs, mount: padMount, throw: padThrow };
    previousTouch = { left:touchInput.left, right:touchInput.right, jump:touchInput.jump, mount:touchInput.mount, throw:touchInput.throw, pause:touchInput.pause };
    touchPressed.left = touchPressed.right = touchPressed.jump = touchPressed.mount = touchPressed.throw = touchPressed.pause = false;
    return { left, right, up, down, jumpHeld, jumpPressed, mountPressed, throwPressed, confirmPressed, startPressed, menuLeftPressed, menuRightPressed, fullscreenPressed };
  }

  addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
    if (!keys.has(e.code)) keysPressed.add(e.code);

  addEventListener("keyup", (e) => keys.delete(e.code));
  addEventListener("blur", () => {

  addEventListener("gamepadconnected", (e) => {

  document.addEventListener("fullscreenchange", updateButtonLabels);

  soundBtn.addEventListener("click", () => { initAudio(); toggleSound(); });
  musicBtn.addEventListener("click", () => { initAudio(); toggleMusic(); });
  fsBtn.addEventListener("click", () => { initAudio(); toggleFullscreen(); });

  canvas.addEventListener("pointerdown", (e) => {
    initAudio();
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * W / r.width;
    const y = (e.clientY - r.top) * H / r.height;
    if (state === "title") {
      state = "select";
      playSfx(500, 0.05, "triangle", 0.025);
    } else if (state === "select") {
      if (x >= 215 && x <= 560 && y >= 210 && y <= 575) selectedCharacter = 0;
      if (x >= 720 && x <= 1065 && y >= 210 && y <= 575) selectedCharacter = 1;
      if (y >= 596 && y <= 674 && x >= 420 && x <= 860) { runDeaths = 0; score = 0; totalGems = 0; startLevel(0); }
    } else if (state === "levelcomplete") {
      if (currentLevel < fairies.length - 1) startLevel(currentLevel + 1);
      else state = "victory";
    } else if (state === "gameover") {
      startLevel(currentLevel);
    } else if (state === "finalgameover") {
      runDeaths = 0; score = 0; totalGems = 0; startLevel(0);
    } else if (state === "victory") {
      state = "title";
      score = 0;
      totalGems = 0;
    }
    canvas.focus();
  });

  function update(dt) {
    frame++;
    const input = getInput();
    if (input.fullscreenPressed) toggleFullscreen();
    updateMusic(dt);

    if (state === "title") {
      if (input.confirmPressed) state = "select";
      keysPressed.clear();
      return;
    }

    if (state === "select") {
      if (input.menuLeftPressed) selectedCharacter = 0;
      if (input.menuRightPressed) selectedCharacter = 1;
      if (input.confirmPressed) { runDeaths = 0; score = 0; totalGems = 0; startLevel(0); }
      keysPressed.clear();
      return;
    }

    if (state === "gameover") {
      if (input.confirmPressed) startLevel(currentLevel);
      keysPressed.clear();
      return;
    }

    if (state === "finalgameover") {
      if (input.confirmPressed) {
        runDeaths = 0;
        score = 0;
        totalGems = 0;
        runDeaths = 0;
        currentLevel = 0;
        startLevel(0);
      }
      keysPressed.clear();
      return;
    }

    if (state === "levelcomplete") {
      if (input.confirmPressed) {
        if (currentLevel < fairies.length - 1) startLevel(currentLevel + 1);
        else state = "victory";
      }
      keysPressed.clear();
      return;
    }

    if (state === "victory") {
      if (input.confirmPressed) {
        state = "title";
        score = 0;
        totalGems = 0;
        runDeaths = 0;
      }
      keysPressed.clear();
      return;
    }

    if (input.startPressed) paused = !paused;
    if (paused) {
      keysPressed.clear();
      return;
    }

    updatePlaying(input, dt);
    keysPressed.clear();
  }

  function ladderForEntity(entity) {
    if (!level || !level.ladders) return null;
    const cx = entity.x + entity.w / 2;
    const bottom = entity.y + entity.h;
    return level.ladders.find(l =>
      cx >= l.x - 14 && cx <= l.x + l.w + 14 &&
      bottom >= l.topY - 8 && entity.y <= l.bottomY + 8
    ) || null;
  }

  function updateComicBursts(s) {
    for (const b of comicBursts) {
      b.y += b.vy * s;
      b.vy -= 0.01 * s;
      b.life -= s;
    }
    comicBursts = comicBursts.filter(b => b.life > 0);
  }

  function updateMovingPlatforms(s) {
    for (const p of level.movingPlatforms) {
      const oldX = p.x;
      const oldY = p.y;
      p.x = p.baseX + Math.sin(frame * p.speed + p.phase) * p.ampX;
      p.y = p.baseY + Math.cos(frame * p.speed * 1.35 + p.phase) * p.ampY;
      p.dx = p.x - oldX;
      p.dy = p.y - oldY;
    }
  }

  function handleSnowballAction() {
    if (!level || !player || !level.boss.alive) return;
    if (player.holdingSnowball) {
      player.holdingSnowball = false;
      const cx = player.x + player.w / 2;
      level.projectiles.push({
        x: cx + player.facing * 30,
        y: player.y + 24,
        w: 24, h: 24,
        vx: player.facing * (player.onUnicorn ? 11.8 : 10.2),
        vy: -3.2,
        life: 260,
        spin: 0,
        state: "playerThrown",
        owner: "player"
      });
      playSfx(370, 0.07, "triangle", 0.027, 180);
      return;
    }
    let nearest = null;
    let best = 92;
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    for (const p of level.projectiles) {
      if (p.state !== "grounded") continue;
      const d = Math.hypot(px - p.x, py - p.y);
      if (d < best) { best = d; nearest = p; }
    }
    if (nearest) {
      nearest.life = 0;
      player.holdingSnowball = true;
      message = "Snowball ready - press Y / Q to throw!";
      messageTimer = 90;
      playSfx(690, 0.055, "triangle", 0.018, 80);
    } else {
      message = "Move close to a snowball on the ground, then press Y / Q.";
      messageTimer = 75;
    }
  }

  function updatePlaying(input, dt) {
    if (!player || !level) return;
    const speedScale = clamp(dt / 16.6667, 0.5, 1.7);
    player.prevY = player.y;
    player.wasOnGround = player.onGround;
    player.blink += 0.06 * speedScale;
    player.landSquash = Math.max(0, player.landSquash - 0.085 * speedScale);
    player.launchStretch = Math.max(0, player.launchStretch - 0.045 * speedScale);
    updateComicBursts(speedScale);
    updateMovingPlatforms(speedScale);
    updateUnicorn(speedScale);
    for (const sp of level.springs) sp.pulse = Math.max(0, (sp.pulse || 0) - 0.055 * speedScale);
    if (player.invuln > 0) player.invuln -= speedScale;
    if (level.boss.invuln > 0) level.boss.invuln -= speedScale;
    if (level.boss.scaredTimer > 0) level.boss.scaredTimer -= speedScale;
    if (messageTimer > 0) messageTimer -= speedScale;
    if (screenShake > 0) screenShake -= speedScale;

    if (input.mountPressed && level.unicorn.unlocked && level.unicorn.spinTimer <= 0) toggleUnicornMount();
    if (input.throwPressed) handleSnowballAction();

    if (input.jumpPressed) player.jumpBuffer = 9;
    else player.jumpBuffer = Math.max(0, player.jumpBuffer - speedScale);
    if (player.onGround) player.coyote = 8;
    else player.coyote = Math.max(0, player.coyote - speedScale);

    if (!player.onUnicorn) {
      const nearbyLadder = ladderForEntity(player);
      if (!player.climbing && nearbyLadder && (input.up || input.down)) {
        const bottom = player.y + player.h;
        const canEnter = (input.up && bottom >= nearbyLadder.topY - 8) || (input.down && player.y <= nearbyLadder.bottomY);
        if (canEnter) {
          player.climbing = true;
          player.ladderId = nearbyLadder.id;
          player.vx = 0;
          player.vy = 0;
          player.x = nearbyLadder.x + nearbyLadder.w / 2 - player.w / 2;
          if (!level.ladderTipShown) {
            message = "Use Up / Down to climb. Goblins use ladders too!";
            messageTimer = 150;
            level.ladderTipShown = true;
          }
        }
      }

      if (player.climbing) {
        const ladder = level.ladders[player.ladderId];
        if (!ladder) {
          player.climbing = false;
          player.ladderId = null;
        } else {
          player.x = lerp(player.x, ladder.x + ladder.w / 2 - player.w / 2, 0.38 * speedScale);
          const climbDir = (input.down ? 1 : 0) - (input.up ? 1 : 0);
          player.vy = climbDir * 4.0;
          player.y += player.vy * speedScale;
          player.runPhase += Math.abs(climbDir) * 0.13 * speedScale;
          const topY = ladder.topY - player.h;
          const bottomY = ladder.bottomY - player.h;
          player.y = clamp(player.y, topY, bottomY);

          if (input.jumpPressed) {
            player.climbing = false;
            player.ladderId = null;
            player.vy = -11.5;
            player.vx = player.facing * 3.0;
            playSfx(450, 0.06, "square", 0.016, 70);
          } else if (input.left || input.right) {
            const dir = input.left ? -1 : 1;
            player.facing = dir;
            player.climbing = false;
            player.ladderId = null;
            player.vx = dir * 3.2;
          } else if (player.y <= topY + 0.5 && input.up) {
            player.climbing = false;
            player.ladderId = null;
            player.y = topY;
            player.vy = 0;
            player.onGround = true;
          } else if (player.y >= bottomY - 0.5 && input.down) {
            player.climbing = false;
            player.ladderId = null;
            player.y = bottomY;
            player.vy = 0;
            player.onGround = true;
          }
        }
      }
    } else {
      player.climbing = false;
      player.ladderId = null;
    }

    if (!player.climbing) {
      const targetVx = (input.left ? -1 : 0) + (input.right ? 1 : 0);
      const maxSpeed = player.onUnicorn ? 9.15 : 7.25;
      if (targetVx !== 0) {
        const target = targetVx * maxSpeed;
        const turning = Math.sign(target) !== Math.sign(player.vx) && Math.abs(player.vx) > 0.4;
        const accelBase = player.onUnicorn ? 1.18 : 1.05;
        const accel = (player.onGround ? accelBase : 0.58) * (turning ? 1.35 : 1);
        const delta = clamp(target - player.vx, -accel * speedScale, accel * speedScale);
        player.vx += delta;
        player.facing = targetVx;
        player.runPhase += Math.abs(player.vx) * (player.onUnicorn ? 0.062 : 0.052) * speedScale;
      } else {
        player.vx *= Math.pow(player.onGround ? (player.onUnicorn ? 0.80 : 0.76) : 0.955, speedScale);
        player.runPhase += 0.008 * speedScale;
      }

      if (player.jumpBuffer > 0 && player.coyote > 0) {
        player.vy = player.onUnicorn ? -17.25 : -14.7;
        player.vx += player.platformCarryVx * 0.9;
        player.onGround = false;
        player.coyote = 0;
        player.jumpBuffer = 0;
        playSfx(player.onUnicorn ? 510 : 440, 0.08, "square", 0.02, player.onUnicorn ? 130 : 90);
      }

      if (!input.jumpHeld && player.vy < -6) player.vy += 0.55 * speedScale;
      const nearApex = Math.abs(player.vy) < 2.4;
      const gravity = nearApex ? (player.onUnicorn ? 0.32 : 0.38) : 0.72;
      player.vy += gravity * speedScale;
      player.vy = Math.min(player.vy, 17);

      player.x += player.vx * speedScale;
      player.x = clamp(player.x, 0, LEVEL_WIDTH - player.w);
      const oldBottom = player.prevY + player.h;
      const preLandingVy = player.vy;
      player.y += player.vy * speedScale;
      player.onGround = false;
      player.platformCarryVx = 0;
      player.platformCarryVy = 0;

      let landingY = Infinity;
      let landedPlatform = null;
      const allPlatforms = level.platforms.concat(level.movingPlatforms);
      for (const p of allPlatforms) {
        const horizontal = player.x + player.w > p.x + 4 && player.x < p.x + p.w - 4;
        const newBottom = player.y + player.h;
        if (horizontal && player.vy >= 0 && oldBottom <= p.y + 11 && newBottom >= p.y && player.y < p.y) {
          if (p.y < landingY) {
            landingY = p.y;
            landedPlatform = p;
          }
        }
      }
      if (landingY < Infinity) {
        player.y = landingY - player.h;
        player.vy = 0;
        player.onGround = true;
        if (!player.wasOnGround && preLandingVy > 7) {
          player.landSquash = Math.min(1, preLandingVy / 15);
          playSfx(125, 0.035, "sine", 0.008);
        }
        if (landedPlatform && "dx" in landedPlatform) {
          player.x += landedPlatform.dx;
          player.y += landedPlatform.dy;
          player.platformCarryVx = landedPlatform.dx / Math.max(0.5, speedScale);
          player.platformCarryVy = landedPlatform.dy / Math.max(0.5, speedScale);
        }
      }

      for (const sp of level.springs) {
        const springRect = { x: sp.x, y: sp.y, w: sp.w, h: sp.h };
        if (rectsOverlap(player, springRect) && player.vy >= 0 && (player.y + player.h) <= sp.y + sp.h + 12) {
          player.y = sp.y - player.h;
          player.vy = -(sp.boost + (player.onUnicorn ? 2.2 : 0));
          player.onGround = false;
          player.landSquash = 1.0;
          player.launchStretch = sp.style === "mushroom" ? 1.0 : 0.72;
          sp.pulse = 1.0;
          screenShake = Math.max(screenShake, sp.style === "mushroom" ? 9 : 5);
          playSfx(sp.style === "mushroom" ? 190 : 620, 0.11, sp.style === "mushroom" ? "square" : "triangle", 0.03, sp.style === "mushroom" ? 310 : 140);
          if (sp.style === "mushroom") setTimeout(() => playSfx(470, 0.10, "triangle", 0.022, 150), 45);
        }
      }
    }

    if (player.y > H + 120) {
      damagePlayer(player.x);
      if (player.hearts > 0) respawnPlayer();
      return;
    }

    if (player.x > level.checkpoint + 900 && player.x < level.boss.arenaLeft - 350) {
      level.checkpoint = Math.floor(player.x / 900) * 900;
    }

    for (const g of level.gems) {
      if (g.collected) continue;
      const gy = g.y + Math.sin(frame * 0.06 + g.phase) * 8;
      if (Math.abs((player.x + player.w / 2) - g.x) < 32 && Math.abs((player.y + player.h / 2) - gy) < 48) {
        g.collected = true;
        score += 50;
        totalGems++;
        level.rainbowCollected.add(g.colorIndex);
        playSfx(820 + g.colorIndex * 25, 0.055, "triangle", 0.02, 160);
        if (level.rainbowCollected.size === 7 && !level.unicorn.unlocked) unlockUnicorn();
      }
    }

    if (!level.bonusStar.collected) {
      const sy = level.bonusStar.y + Math.sin(frame * 0.07 + level.bonusStar.phase) * 8;
      if (Math.abs((player.x + player.w / 2) - level.bonusStar.x) < 34 && Math.abs((player.y + player.h / 2) - sy) < 44) {
        level.bonusStar.collected = true;
        score += 500;
        if (player.hearts < player.maxHearts) player.hearts++;
        message = "Secret Magic Star - heart restored!";
        messageTimer = 120;
        jingle();
      }
    }

    for (const e of level.enemies) {
      if (!e.alive) continue;
      e.blink += 0.06 * speedScale;
      e.bob += 0.05 * speedScale;
      if (e.climbCooldown !== undefined) e.climbCooldown -= speedScale;
      if (e.ladderId !== undefined) {
        const ladder = level.ladders[e.ladderId];
        const ladderX = ladder.x + ladder.w / 2 - e.w / 2;
        if (e.mode === "climb") {
          e.x = lerp(e.x, ladderX, 0.24 * speedScale);
          e.y += e.climbDir * (1.55 + currentLevel * 0.04) * speedScale;
          e.vx = 0;
          if (e.climbDir < 0 && e.y <= ladder.topY - e.h) {
            e.y = ladder.topY - e.h;
            e.mode = "platform";
            e.left = ladder.platformLeft;
            e.right = ladder.platformRight;
            e.vx = (e.ladderId % 2 ? -1 : 1) * (1.05 + currentLevel * 0.04);
            e.climbCooldown = 120;
          } else if (e.climbDir > 0 && e.y >= ladder.bottomY - e.h) {
            e.y = ladder.bottomY - e.h;
            e.mode = "ground";
            e.left = e.baseLeft;
            e.right = e.baseRight;
            e.vx = (e.ladderId % 2 ? 1 : -1) * (1.08 + currentLevel * 0.04);
            e.climbCooldown = 110;
          }
        } else {
          e.x += e.vx * speedScale;
          if (e.x < e.left || e.x > e.right) { e.x = clamp(e.x, e.left, e.right); e.vx *= -1; }
          const goblinCenter = e.x + e.w / 2;
          const ladderCenter = ladder.x + ladder.w / 2;
          if (e.climbCooldown <= 0 && Math.abs(goblinCenter - ladderCenter) < 14) {
            e.mode = "climb";
            e.climbDir = e.y < GROUND_Y - e.h - 30 ? 1 : -1;
            if (e.y <= ladder.topY - e.h + 8) e.climbDir = 1;
            if (e.y >= ladder.bottomY - e.h - 8) e.climbDir = -1;
            e.climbCooldown = 150;
          }
        }
      } else {
        e.x += e.vx * speedScale;
        if (e.x < e.left || e.x > e.right) e.vx *= -1;
      }

      if (player.onUnicorn) {
        const ucx = player.x + player.w / 2;
        const unicornBody = {
          x: ucx - 55,
          y: player.y + player.h - 86,
          w: 118,
          h: 78
        };
        if (rectsOverlap(unicornBody, e)) {
          if (Math.abs(player.vx) > 1.35) {
            banishEnemy(e, "barge");
            continue;
          }
          damagePlayer(e.x + e.w / 2);
          continue;
        }
      }

      if (rectsOverlap(player, e)) {
        const prevBottom = player.prevY + player.h;
        if (!player.climbing && player.vy > 0 && prevBottom <= e.y + 14) banishEnemy(e, "stomp");
        else damagePlayer(e.x + e.w / 2);
      }
    }

    updateBoss(speedScale);
    updateProjectiles(speedScale);
    updateIcicles(speedScale);

    let hornHit = false;
    if (level.boss.alive && player.onUnicorn && Math.abs(player.vx) > 2.2) {
      const center = player.x + player.w / 2;
      const hornRect = { x: player.facing > 0 ? center + 38 : center - 88, y: player.y + 6, w: 50, h: 42 };
      if (rectsOverlap(hornRect, level.boss)) hornHit = hitBoss("horn");
    }
    if (level.boss.alive && !hornHit && rectsOverlap(player, level.boss)) {
      const prevBottom = player.prevY + player.h;
      if (!player.climbing && player.vy > 0 && prevBottom <= level.boss.y + 18) hitBoss("stomp");
      else damagePlayer(level.boss.x + level.boss.w / 2);
    }

    if (!level.boss.alive) {
      const fairyRect = { x: level.fairyX - 26, y: 438 + Math.sin(frame * 0.045) * 12, w: 58, h: 88 };
      if (rectsOverlap(player, fairyRect)) {
        level.fairyFound = true;
        state = "levelcomplete";
        score += 1000;
        jingle();
      }
    }

    if (!level.bossIntroduced && player.x > level.boss.arenaLeft - 210) {
      level.bossIntroduced = true;
      message = player.onUnicorn ? "Horn, stomp, or throw his grounded snowballs back - 3 hits!" : "Stomp Jack Frost or throw his grounded snowballs back - 3 hits!";
      messageTimer = 230;
      playSfx(160, 0.20, "sawtooth", 0.03, 60);
    }

    const targetCam = clamp(player.x - W * 0.36, 0, LEVEL_WIDTH - W);
    cameraX = lerp(cameraX, targetCam, 0.09 * speedScale);
  }

  function updateBoss(s) {
    const b = level.boss;
    if (!b.alive) return;
    if (player.x < level.boss.arenaLeft - 300) return;

    b.facing = player.x < b.x ? -1 : 1;
    b.phase = b.hp <= 2 ? 2 : 1;
    b.attackTimer -= s;
    b.jumpTimer -= s;
    b.dashTimer -= s;
    b.icicleTimer -= s;

    if (b.dashActive) {
      b.x += b.dashDir * (7.2 + currentLevel * 0.15) * s;
      if (b.x < b.arenaLeft || b.x + b.w > b.arenaRight) {
        b.dashActive = false;
        b.x = clamp(b.x, b.arenaLeft, b.arenaRight - b.w);
        b.vx *= -1;
      }
    } else if (b.onGround) {
      b.x += b.vx * s;
      if (b.x < b.arenaLeft || b.x + b.w > b.arenaRight) b.vx *= -1;
      if (b.jumpTimer <= 0) {
        b.vy = -11.7;
        b.onGround = false;
        b.jumpTimer = 120 + currentLevel * 4;
      }
      if (b.phase === 2 && b.dashTimer <= 0) {
        b.dashActive = true;
        b.dashDir = player.x < b.x ? -1 : 1;
        b.dashTimer = 190;
        screenShake = Math.max(screenShake, 7);
        playSfx(220, 0.08, "sawtooth", 0.025, 90);
      }
    }

    if (!b.onGround) {
      b.vy += 0.55 * s;
      b.y += b.vy * s;
      b.x += b.vx * 0.75 * s;
      if (b.y + b.h >= GROUND_Y) {
        b.y = GROUND_Y - b.h;
        b.vy = 0;
        b.onGround = true;
      }
      if (b.x < b.arenaLeft || b.x + b.w > b.arenaRight) b.vx *= -1;
    }

    if (b.attackTimer <= 0) {
      const dir = player.x < b.x ? -1 : 1;
      level.projectiles.push({
        x: b.x + b.w / 2,
        y: b.y + 34,
        w: 24,
        h: 24,
        vx: dir * (5.2 + currentLevel * 0.15),
        vy: -2.8,
        life: 900,
        spin: Math.random() * Math.PI * 2,
        state: "bossFlying",
        owner: "boss"
      });
      if (b.phase === 2) {
        level.projectiles.push({
          x: b.x + b.w / 2,
          y: b.y + 24,
          w: 20,
          h: 20,
          vx: dir * (4.0 + currentLevel * 0.1),
          vy: -5.2,
          life: 220,
          spin: Math.random() * Math.PI * 2
        });
      }
      b.attackTimer = Math.max(48, (b.phase === 2 ? 75 : 95) - currentLevel * 4);
      playSfx(240, 0.055, "sine", 0.02, -50);
    }

    if (b.phase === 2 && b.icicleTimer <= 0) {
      const count = 3 + (currentLevel > 3 ? 1 : 0);
      for (let i = 0; i < count; i++) {
        const tx = clamp(player.x - 70 + i * 70 + (Math.random() * 50 - 25), b.arenaLeft + 20, b.arenaRight - 20);
        activeIcicles.push({ x: tx, y: -40 - i * 24, w: 18, h: 38, vy: 4.5 + i * 0.25, warn: 60, life: 300 });
      }
      b.icicleTimer = 200;
      playSfx(310, 0.07, "triangle", 0.018, -80);
    }
  }

  function updateProjectiles(s) {
    const b = level.boss;
    for (const p of level.projectiles) {
      if (p.life <= 0) continue;
      if (p.state === "grounded") {
        p.life -= 0.18 * s;
        p.spin *= 0.9;
        continue;
      }

      p.x += p.vx * s;
      p.vy += (p.owner === "player" ? 0.18 : 0.13) * s;
      p.y += p.vy * s;
      p.life -= s;
      p.spin += 0.2 * s;

      if (p.owner === "player" && b.alive && rectsOverlap(p, b)) {
        p.life = 0;
        hitBoss("snowball");
        continue;
      }

      if (p.owner !== "player" && rectsOverlap(player, p)) {
        p.life = 0;
        damagePlayer(p.x);
        continue;
      }

      if (p.y + p.h / 2 >= GROUND_Y - 5 && p.x > b.arenaLeft - 520 && p.x < b.arenaRight + 420) {
        p.y = GROUND_Y - p.h / 2 - 4;
        p.vx = 0;
        p.vy = 0;
        p.state = "grounded";
        p.owner = "neutral";
        p.life = Math.max(p.life, 1000);
        playSfx(125, 0.04, "sine", 0.009, -25);
      }
    }
    level.projectiles = level.projectiles.filter(p => p.life > 0 && p.y < H + 100 && p.x > b.arenaLeft - 720 && p.x < b.arenaRight + 560);
  }

  function updateIcicles(s) {
    for (const ic of activeIcicles) {
      if (ic.warn > 0) {
        ic.warn -= s;
      } else {
        ic.y += ic.vy * s;
        ic.vy += 0.08 * s;
        if (ic.life > 0) ic.life -= s;
        if (rectsOverlap(player, ic)) {
          ic.life = 0;
          damagePlayer(ic.x);
        }
      }
    }
    activeIcicles = activeIcicles.filter(ic => ic.life > 0 && ic.y < H + 80);
  }

  function draw() {
    ctx.save();
    if (screenShake > 0 && state === "playing") {
      ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake * 0.55);
    }

    if (state === "title") drawTitle();
    else if (state === "select") drawCharacterSelect();
    else if (["playing", "levelcomplete", "gameover", "finalgameover"].includes(state)) {
      drawWorld();
      drawHUD();
      if (paused) drawPause();
      if (state === "levelcomplete") drawLevelComplete();
      if (state === "gameover") drawGameOver();
      if (state === "finalgameover") drawFinalGameOver();
    } else if (state === "victory") drawVictory();

    ctx.restore();
  }

  function roundedRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function roundedRect(x, y, w, h, r, fill, stroke = null, lineWidth = 2) {
    roundedRectPath(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lineWidth; ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function drawTitle() {
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, "#88e1ff");
    grd.addColorStop(0.55, "#d4f4ff");
    grd.addColorStop(1, "#ffe9fb");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    drawRainbow(640, 410, 470, 46);
    drawCloud(120, 138, 1.45);
    drawCloud(1095, 170, 1.18);
    drawCloud(905, 344, 0.78);
    drawSparkles(0, 0, W, H, 38, 1);

    for (let i = 0; i < 6; i++) {
      drawSmallButterfly(170 + i * 160, 130 + Math.sin(frame * 0.03 + i) * 18, i % fairies.length);
    }

    ctx.textAlign = "center";
    ctx.fillStyle = "#4d2e7c";
    ctx.font = "900 70px system-ui";
    ctx.fillText("Rainbow Magic", W / 2, 148);
    ctx.font = "900 80px system-ui";
    ctx.fillStyle = "#ff529d";
    ctx.fillText("Fairy Hunt", W / 2, 230);

    ctx.font = "800 22px system-ui";
    ctx.fillStyle = "#59486f";
    ctx.fillText("A cute platform adventure for Kirsty, Rachel and the rainbow fairies", W / 2, 278);

    drawFairy(200, 315, fairies[0].color, 1.26, true);
    drawFairy(1015, 300, fairies[4].color, 1.16, true);
    drawGirl(452, 445, characters[0], 1.5, 1, frame * 0.02, false);
    drawGirl(812, 445, characters[1], 1.5, -1, frame * 0.02, false);

    roundedRect(390, 550, 500, 92, 26, "rgba(255,255,255,.9)", "#7551a5", 4);
    ctx.fillStyle = "#553372";
    ctx.font = "800 31px system-ui";
    ctx.fillText("Press ENTER or controller B", W / 2, 606);

    ctx.font = "700 17px system-ui";
    ctx.fillStyle = "#614f78";
    ctx.fillText("Now with music, fuller boss battles and full screen play", W / 2, 676);
  }

  function drawCharacterSelect() {
    const grd = ctx.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, "#c8eeff");
    grd.addColorStop(1, "#f9d2ff");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
    drawSparkles(0, 0, W, H, 28, 2);

    ctx.textAlign = "center";
    ctx.fillStyle = "#4c3475";
    ctx.font = "900 52px system-ui";
    ctx.fillText("Choose your adventurer", W / 2, 95);
    ctx.font = "600 20px system-ui";
    ctx.fillStyle = "#66517e";
    ctx.fillText("Use left and right, then press B or Enter", W / 2, 132);

    drawCharacterCard(215, 210, 345, 365, 0);
    drawCharacterCard(720, 210, 345, 365, 1);

    roundedRect(420, 596, 440, 78, 24, "#ffffff", "#6b4ba0", 4);
    ctx.fillStyle = "#4d3178";
    ctx.font = "850 27px system-ui";
    ctx.fillText(`Play as ${characters[selectedCharacter].name}`, W / 2, 646);
  }

  function drawCharacterCard(x, y, w, h, index) {
    const selected = selectedCharacter === index;
    roundedRect(x, y, w, h, 30, selected ? "rgba(255,255,255,.98)" : "rgba(255,255,255,.66)", selected ? "#7a54b5" : "rgba(90,66,120,.25)", selected ? 6 : 3);
    if (selected) {
      ctx.save();
      ctx.globalAlpha = 0.6;
      drawSparkles(x, y, w, h, 12, index + 5);
      ctx.restore();
    }
    drawGirl(x + w / 2, y + 162, characters[index], 2.05, 1, frame * 0.02, false);
    ctx.textAlign = "center";
    ctx.fillStyle = "#4c3475";
    ctx.font = "900 34px system-ui";
    ctx.fillText(characters[index].name, x + w / 2, y + 310);
    ctx.font = "650 16px system-ui";
    ctx.fillStyle = "#6c5a7e";
    ctx.fillText(index === 0 ? "Quick, brave and curious" : "Kind, clever and adventurous", x + w / 2, y + 338);
  }

  function drawWorld() {
    drawBackground(level.fairy, currentLevel);
    ctx.save();
    ctx.translate(-cameraX, 0);

    drawFarThemeDecorations(level.fairy, currentLevel);
    for (const p of level.platforms) drawPlatform(p, level.fairy, currentLevel);
    for (const ladder of level.ladders) drawLadder(ladder, level.fairy);
    for (const mp of level.movingPlatforms) drawMovingPlatform(mp, level.fairy, currentLevel);
    for (const sp of level.springs) drawSpringPad(sp, level.fairy, currentLevel);
    drawNearThemeDecorations(level.fairy, currentLevel);

    for (const g of level.gems) if (!g.collected) drawGem(g.x, g.y + Math.sin(frame * 0.06 + g.phase) * 8, g.color);
    if (!level.bonusStar.collected) drawBonusStar(level.bonusStar.x, level.bonusStar.y + Math.sin(frame * 0.07 + level.bonusStar.phase) * 8);
    for (const e of level.enemies) if (e.alive) drawGoblin(e);
    for (const p of level.projectiles) drawSnowball(p.x, p.y, p.spin || 0, p.state === "grounded");
    for (const ic of activeIcicles) drawIcicle(ic);
    if (level.boss.alive) drawJackFrost(level.boss);
    else drawFairy(level.fairyX, 474 + Math.sin(frame * 0.045) * 12, level.fairy.color, 1.18, true);

    const u = level.unicorn;
    const spinProgress = u.spinTimer > 0 ? 1 - u.spinTimer / u.spinTotal : 0;
    const spinAngle = u.spinTimer > 0 ? spinProgress * Math.PI * 6 : 0;
    if (player.onUnicorn) {
      drawUnicorn(player.x + player.w / 2, player.y + player.h, player.facing, player.runPhase, spinAngle, true);
      if (player.holdingSnowball) drawSnowball(player.x + player.w / 2 + player.facing * 30, player.y + 15, frame * 0.08, false);
    } else {
      if (u.unlocked) drawUnicorn(u.x, u.y, u.facing, u.phase, spinAngle, false);
      drawGirl(player.x + player.w / 2, player.y + player.h / 2, characters[selectedCharacter], 1.0, player.facing, player.runPhase, true);
      if (player.holdingSnowball) drawSnowball(player.x + player.w / 2 + player.facing * 28, player.y + 8, frame * 0.08, false);
    }
    for (const burst of comicBursts) drawComicBurst(burst);
    ctx.restore();
  }

  function drawBackground(fairy, index) {
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, fairy.sky1);
    grd.addColorStop(0.56, fairy.sky2);
    grd.addColorStop(1, "#f8f1ff");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    if (index === 4) {
      ctx.fillStyle = "rgba(124, 212, 255, 0.38)";
      ctx.fillRect(0, 520, W, 200);
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = `rgba(255,255,255,${0.15 + (i % 2) * 0.06})`;
        ctx.fillRect(0, 545 + i * 12, W, 4);
      }
    }

    const par1 = -cameraX * 0.16;
    ctx.save();
    ctx.translate(par1 % 560, 0);
    for (let i = -1; i < 4; i++) {
      const x = i * 560;
      ctx.fillStyle = index === 5 || index === 6 ? "rgba(255,255,255,.11)" : "rgba(255,255,255,.2)";
      ctx.beginPath();
      ctx.arc(x + 220, 490, 245, Math.PI, 0);
      ctx.fill();
    }
    ctx.restore();

    if (index === 5 || index === 6) {
      drawStars(index === 6 ? 40 : 26);
      if (index === 6) drawMoon(1040, 128, 54);
    }

    const par2 = -cameraX * 0.33;
    ctx.save();
    ctx.translate(par2 % 720, 0);
    for (let i = -1; i < 4; i++) {
      if (index === 3) drawTreeSilhouette(i * 720 + 150, 470, 1.0 + (i % 2) * 0.15, "rgba(40,101,63,.30)");
      else if (index === 1) drawOrchardSilhouette(i * 720 + 170, 480, 1.0 + (i % 2) * 0.15);
      else if (index === 2) drawSunflowerSilhouette(i * 720 + 140, 515, 0.9 + (i % 3) * 0.08);
      else drawCloud(i * 720 + 180, 120 + (i % 2) * 80, 0.8 + (i % 3) * 0.12);
    }
    ctx.restore();
  }

  function drawFarThemeDecorations(fairy, index) {
    if (index === 0) {
      for (let x = 260; x < LEVEL_WIDTH; x += 410) drawHillFlowerPatch(x, 575, fairy.color);
    } else if (index === 1) {
      for (let x = 260; x < LEVEL_WIDTH; x += 520) drawOrangeTree(x, 540, 1.0);
    } else if (index === 2) {
      for (let x = 240; x < LEVEL_WIDTH; x += 410) drawSunflower(x, 560, 1.15);
    } else if (index === 3) {
      for (let x = 260; x < LEVEL_WIDTH; x += 440) drawTree(x, 545, 1.18, fairy.color);
    } else if (index === 4) {
      for (let x = 260; x < LEVEL_WIDTH; x += 490) drawShellCluster(x, 582, 1.0);
    } else if (index === 5) {
      for (let x = 280; x < LEVEL_WIDTH; x += 460) drawCrystalCluster(x, 575, 1.0, fairy.color);
    } else if (index === 6) {
      for (let x = 260; x < LEVEL_WIDTH; x += 430) drawMoonFlowers(x, 575, fairy.color);
    }
  }

  function drawNearThemeDecorations(fairy, index) {
    for (let x = 170; x < LEVEL_WIDTH; x += 320) {
      const y = GROUND_Y - 14;
      if (index === 0) drawTulip(x, y, fairy.color);
      else if (index === 1) drawMiniPumpkin(x, y, fairy.accent);
      else if (index === 2) drawDaisy(x, y, "#ffd33f");
      else if (index === 3) drawFernLeaf(x, y, fairy.color);
      else if (index === 4) drawSeaFlower(x, y, fairy.color);
      else if (index === 5) drawCrystalBud(x, y, fairy.color);
      else drawNightBloom(x, y, fairy.color);
    }
  }

  function drawPlatform(p, fairy, index) {
    if (p.h > 40) {
      ctx.fillStyle = fairy.land;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = "rgba(54,54,74,.18)";
      for (let x = p.x + 20; x < p.x + p.w; x += 45) {
        ctx.beginPath();
        ctx.arc(x, p.y + 42 + ((x / 45) % 2) * 25, 6, 0, Math.PI * 2);
        ctx.fill();
      }
      const topColor = index === 4 ? "#c9f5ff" : index === 5 ? "#a6a0ff" : index === 6 ? "#ddb8ff" : "#69df74";
      const edgeColor = index === 2 ? "#fff18b" : topColor;
      ctx.fillStyle = topColor;
      ctx.fillRect(p.x, p.y - 11, p.w, 14);
      ctx.fillStyle = edgeColor;
      ctx.fillRect(p.x, p.y - 11, p.w, 5);
    } else {
      const plate = index === 5 ? "#e9e4ff" : index === 4 ? "#fff5d8" : "#ffe8c9";
      roundedRect(p.x, p.y, p.w, p.h, 10, plate, "rgba(100,65,95,.2)", 2);
      ctx.fillStyle = fairy.color;
      ctx.globalAlpha = 0.36;
      ctx.fillRect(p.x + 8, p.y + 5, p.w - 16, 5);
      ctx.globalAlpha = 1;
      if (index === 3) {
        ctx.fillStyle = "rgba(78,124,87,.18)";
        ctx.fillRect(p.x + 10, p.y + 10, p.w - 20, 6);
      }
    }
  }

  function drawLadder(ladder, fairy) {
    ctx.save();
    const top = ladder.topY + 2;
    const bottom = ladder.bottomY;
    ctx.strokeStyle = "#8c653c";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ladder.x + 5, top); ctx.lineTo(ladder.x + 5, bottom);
    ctx.moveTo(ladder.x + ladder.w - 5, top); ctx.lineTo(ladder.x + ladder.w - 5, bottom);
    ctx.stroke();
    ctx.strokeStyle = "#c79459";
    ctx.lineWidth = 4;
    for (let y = top + 13; y < bottom; y += 22) {
      ctx.beginPath();
      ctx.moveTo(ladder.x + 6, y);
      ctx.lineTo(ladder.x + ladder.w - 6, y);
      ctx.stroke();
    }
    ctx.fillStyle = fairy.color;
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(ladder.x + ladder.w / 2, top + 5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBonusStar(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(frame * 0.04) * 0.18);
    ctx.shadowColor = "#fff17e";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ffe66f";
    drawStar(0, 0, 16, 7.5);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.85)";
    drawStar(-4, -5, 4, 2);
    ctx.restore();
  }

  function drawComicBurst(b) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, b.life / 18);
    ctx.translate(b.x, b.y);
    ctx.rotate(-0.1);
    ctx.textAlign = "center";
    ctx.font = "900 24px system-ui";
    ctx.lineWidth = 5;
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.strokeText(b.text, 0, 0);
    ctx.fillStyle = "#7d4e9e";
    ctx.fillText(b.text, 0, 0);
    ctx.restore();
  }

  function drawMovingPlatform(p, fairy, index) {
    ctx.save();
    if (p.style === "cloud") {
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.beginPath();
      ctx.arc(p.x + 26, p.y + 14, 16, 0, Math.PI * 2);
      ctx.arc(p.x + 52, p.y + 10, 20, 0, Math.PI * 2);
      ctx.arc(p.x + 82, p.y + 14, 17, 0, Math.PI * 2);
      ctx.arc(p.x + 112, p.y + 15, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = fairy.color;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(p.x + 16, p.y + 9, p.w - 32, 5);
    } else if (p.style === "leaf") {
      ctx.fillStyle = "#95dd78";
      roundedRect(p.x, p.y + 3, p.w, p.h - 3, 12, "#95dd78", "rgba(70,120,60,.25)", 2);
      ctx.strokeStyle = "#64a852";

  function drawSpringPad(sp, fairy, index) {
    ctx.save();
    if (sp.required) {
      ctx.fillStyle = "rgba(255,255,255,.92)";
      roundedRect(sp.x - 14, sp.y - 58, sp.w + 28, 24, 9, "rgba(255,255,255,.92)", fairy.color, 2);
      ctx.textAlign = "center";
      ctx.fillStyle = "#5a3c78";
      ctx.font = "900 11px system-ui";
      ctx.fillText("BOUNCE!", sp.x + sp.w / 2, sp.y - 42);
    }
    const pulse = clamp(sp.pulse || 0, 0, 1);
    const cx = sp.x + sp.w / 2;

    if (pulse > 0.02) {
      ctx.save();
      ctx.globalAlpha = pulse * 0.75;
      ctx.strokeStyle = "rgba(255,255,255,.95)";
      ctx.lineWidth = 3;
      for (let r = 0; r < 3; r++) {
        ctx.beginPath();
        ctx.ellipse(cx, sp.y + 2, 24 + r * 15 + (1 - pulse) * 20, 8 + r * 5 + (1 - pulse) * 8, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = "#ffe779";
      for (let i = 0; i < 7; i++) {
        const a = -Math.PI + i * Math.PI / 6;
        const rr = 25 + (1 - pulse) * 36;
        drawStar(cx + Math.cos(a) * rr, sp.y - 8 + Math.sin(a) * rr * 0.55, 5 + pulse * 3, 2.3 + pulse);
      }
      ctx.restore();
    }

    if (sp.style === "mushroom") {
      const squashY = 1 - pulse * 0.42;
      const widen = 1 + pulse * 0.30;
      ctx.translate(cx, sp.y + 4);
      ctx.scale(widen, squashY);

      const stemGrad = ctx.createLinearGradient(0, 0, 0, 22);
      stemGrad.addColorStop(0, "#fff9e9");
      stemGrad.addColorStop(1, "#e8d5b7");
      roundedRect(-7, 1, 14, 20, 5, stemGrad, "rgba(120,95,80,.2)", 1.5);

      const capGrad = ctx.createRadialGradient(-7, -8, 4, 0, -5, 24);
      capGrad.addColorStop(0, "#ff9bc0");
      capGrad.addColorStop(0.5, fairy.color);
      capGrad.addColorStop(1, "#a73c70");
      ctx.fillStyle = capGrad;
      ctx.beginPath();
      ctx.moveTo(-25, 1);
      ctx.quadraticCurveTo(-18, -22 - pulse * 3, 0, -24 - pulse * 4);
      ctx.quadraticCurveTo(18, -22 - pulse * 3, 25, 1);
      ctx.quadraticCurveTo(10, 6, 0, 5);
      ctx.quadraticCurveTo(-10, 6, -25, 1);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,.88)";
      [[-11,-8,4.5],[8,-12,4],[1,-4,3.2]].forEach(d => {
        ctx.beginPath(); ctx.arc(d[0], d[1], d[2], 0, Math.PI * 2); ctx.fill();
      });

      if (pulse > 0.1) {
        ctx.fillStyle = "rgba(255,255,255,.6)";
        ctx.beginPath();
        ctx.ellipse(0, 3, 19, 3.5 + pulse * 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (sp.style === "star") {
      roundedRect(sp.x + 5, sp.y + 5 + pulse * 3, sp.w - 10, 10 - pulse * 2, 4, "#b5f7ff", "rgba(60,130,150,.3)", 2);
      ctx.fillStyle = "#ffe277";
      drawStar(cx, sp.y - 2 - pulse * 4, 12 + pulse * 3, 5 + pulse);
    } else {
      const flowerSquash = 1 - pulse * 0.24;
      ctx.save();
      ctx.translate(cx, sp.y);
      ctx.scale(1 + pulse * 0.15, flowerSquash);
      ctx.fillStyle = "#60b55b";
      ctx.fillRect(-4, 2, 8, 16);
      ctx.fillStyle = fairy.color;
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI * 2 / 6;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 10, Math.sin(a) * 8, 6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#ffe474";
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawGirl(cx, cy, c, scale = 1, facing = 1, run = 0, flicker = true) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(facing * scale, scale);
    if (flicker && player && player.invuln > 0 && state === "playing" && Math.floor(frame / 4) % 2 === 0) ctx.globalAlpha = 0.45;

    const isActivePlayer = flicker && player && state === "playing";
    const moveAmount = isActivePlayer ? Math.min(1, Math.abs(player.vx || 0) / 6.5) : 0.42;
    const climbing = isActivePlayer && player.climbing;
    const squash = isActivePlayer ? player.landSquash : 0;
    const launchStretch = isActivePlayer ? player.launchStretch : 0;
    const bob = climbing ? 0 : Math.sin(run * 1.8) * 2.2 * moveAmount;
    const armSwing = climbing ? Math.sin(run * 1.7) * 7.2 : Math.sin(run) * 5.1 * (0.28 + moveAmount * 0.72);
    const legSwing = climbing ? -Math.sin(run * 1.7) * 6.2 : Math.sin(run) * 5.8 * (0.28 + moveAmount * 0.72);
    const hairBounce = climbing ? 0.5 : Math.sin(run * 1.7 + 0.8) * 1.45 * (0.3 + moveAmount * 0.7);
    const skirtSway = climbing ? Math.sin(run) * 1.0 : Math.sin(run * 1.5) * 2.0 * (0.25 + moveAmount * 0.75);
    ctx.translate(0, bob + squash * 2.0 - launchStretch * 2.5);
    ctx.scale(1 + squash * 0.08 - launchStretch * 0.055, 1 - squash * 0.07 + launchStretch * 0.13);

    if (c.hairStyle === "curlyPonytail") {
      ctx.fillStyle = c.hair;
      ctx.beginPath(); ctx.arc(-17, -40 + hairBounce, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-22, -34 + hairBounce, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-17, -28 + hairBounce, 6.5, 0, Math.PI * 2); ctx.fill();
    }

    ctx.strokeStyle = c.skin;
    ctx.lineWidth = 5.6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-14, -8); ctx.lineTo(-22 + (climbing ? -armSwing * 0.2 : 0), 2 + armSwing); ctx.lineTo(-23, 8 + armSwing * 0.2);
    ctx.moveTo(14, -8); ctx.lineTo(22 + (climbing ? armSwing * 0.2 : 0), -3 - armSwing); ctx.lineTo(23, 3 - armSwing * 0.2);
    ctx.stroke();

    ctx.strokeStyle = c.leggings;
    ctx.lineWidth = 5.5;
    ctx.beginPath();
    ctx.moveTo(-8, 20); ctx.lineTo(-10 + legSwing, 36); ctx.lineTo(-13 + legSwing, 42);
    ctx.moveTo(8, 20); ctx.lineTo(10 - legSwing, 36); ctx.lineTo(13 - legSwing, 42);
    ctx.stroke();

    ctx.fillStyle = c.shoes;
    roundedRect(-19 + legSwing, 39, 12, 6, 2, c.shoes);
    roundedRect(7 - legSwing, 39, 12, 6, 2, c.shoes);

    const dressGrad = ctx.createLinearGradient(0, -16, 0, 26);
    dressGrad.addColorStop(0, c.shirt);
    dressGrad.addColorStop(1, c.trim);
    roundedRect(-16, -22, 32, 28, 9, dressGrad);
    ctx.fillStyle = c.skirt;
    ctx.beginPath();
    ctx.moveTo(-18, 4); ctx.lineTo(18, 4); ctx.lineTo(13 + skirtSway, 25); ctx.lineTo(-13 + skirtSway, 25); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = c.trim;
    ctx.fillRect(-13, 18, 26, 3.5);

    if (c.locket) {
      ctx.strokeStyle = "#d7d8e4";
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -12, 7, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.fillStyle = "#f4f4ff";
      ctx.beginPath(); ctx.arc(0, -5, 2.4, 0, Math.PI * 2); ctx.fill();
    }

    // Hair sits behind the head. Keep its lower edge above the neck so it
    // cannot read as a beard or overlap the shirt beneath the chin.
    ctx.fillStyle = c.hair;
    if (c.hairStyle === "bob") {
      ctx.beginPath();
      ctx.ellipse(0, -37.5, 19.3, 19.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-17.5, -39); ctx.quadraticCurveTo(-20.5, -31 + hairBounce, -17.0, -24.5); ctx.lineTo(-11.5, -26.5); ctx.lineTo(-10.5, -39); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(17.5, -39); ctx.quadraticCurveTo(20.5, -31 - hairBounce, 17.0, -24.5); ctx.lineTo(11.5, -26.5); ctx.lineTo(10.5, -39); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.ellipse(0, -38, 19.2, 19.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-17, -39); ctx.quadraticCurveTo(-20, -31, -17, -24.5); ctx.lineTo(-11, -27); ctx.lineTo(-10, -40); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(17, -39); ctx.quadraticCurveTo(20, -31, 17, -24.5); ctx.lineTo(11, -27); ctx.lineTo(10, -40); ctx.closePath(); ctx.fill();
    }

    // Face is painted over the rear hair, followed by a visible neck gap.
    ctx.fillStyle = c.skin;
    ctx.beginPath();
    ctx.ellipse(0, -35, 13.8, 15.7, 0, 0, Math.PI * 2);
    ctx.fill();
    roundedRect(-4.2, -22.0, 8.4, 8.0, 3.2, c.skin);
    ctx.fillStyle = c.shirt;
    ctx.beginPath();
    ctx.moveTo(-9.5, -16.0); ctx.lineTo(9.5, -16.0); ctx.lineTo(7.5, -12.0); ctx.lineTo(-7.5, -12.0); ctx.closePath();
    ctx.fill();

    // A restrained fringe sits only on the forehead rather than covering the face.
    ctx.fillStyle = c.hair;
    if (c.hairStyle === "bob") {
      ctx.beginPath();
      ctx.moveTo(-12.5, -43.5);
      ctx.quadraticCurveTo(-5, -51.5, 5.5, -49.5);
      ctx.quadraticCurveTo(11.5, -48.2, 13, -42.0);
      ctx.quadraticCurveTo(7.5, -43.7, 4.5, -39.5);
      ctx.quadraticCurveTo(0, -43.0, -4.0, -39.2);
      ctx.quadraticCurveTo(-8.0, -42.7, -12.5, -41.0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = c.hair2;
      ctx.beginPath();
      ctx.moveTo(-10.5, -45); ctx.quadraticCurveTo(-1, -50, 9.5, -45); ctx.quadraticCurveTo(0, -46.5, -8, -42.8); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(-12.2, -44.0);
      ctx.quadraticCurveTo(-7, -51, 1, -51);
      ctx.quadraticCurveTo(9.5, -50, 12.8, -43.2);
      ctx.quadraticCurveTo(7.5, -44.0, 4.5, -39.8);
      ctx.quadraticCurveTo(0.5, -43.4, -3.5, -40.0);
      ctx.quadraticCurveTo(-7.8, -43.5, -12.2, -41.3);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = c.hair2;
      for (const q of [[-8.5,-46,3.8],[-2,-48.5,4.0],[5,-47.8,3.8]]) {
        ctx.beginPath(); ctx.arc(q[0], q[1], q[2], 0, Math.PI * 2); ctx.fill();
      }
    }

    // Short temple locks frame the upper face only. They stop well above
    // the jaw and neck, leaving the whole lower face cleanly visible.
    ctx.fillStyle = c.hair;
    ctx.beginPath(); ctx.ellipse(-14.2, -36.0, 2.8, 5.5, -0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14.2, -36.0, 2.8, 5.5, 0.12, 0, Math.PI * 2); ctx.fill();

    if (c.hairStyle === "bob") {
      ctx.fillStyle = c.bow;
      ctx.beginPath(); ctx.ellipse(-8, -50, 4.5, 3.1, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-1, -50, 4.0, 3.1, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-4.5, -50, 2.1, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = c.bow;
      ctx.beginPath(); ctx.ellipse(-14, -44, 4.2, 2.8, -0.5, 0, Math.PI * 2); ctx.fill();
    }

    const eyeClosed = Math.floor((frame + Math.abs(cx)) / 95) % 22 === 0;
    ctx.strokeStyle = "#604c4f";
    ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.moveTo(-7, -41); ctx.quadraticCurveTo(-4.5, -42.5, -2, -41); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, -41); ctx.quadraticCurveTo(4.5, -42.5, 7, -41); ctx.stroke();

    if (eyeClosed) {
      ctx.beginPath(); ctx.moveTo(-6.2, -36.2); ctx.quadraticCurveTo(-4.5, -35, -2.8, -36.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2.8, -36.2); ctx.quadraticCurveTo(4.5, -35, 6.2, -36.2); ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.beginPath(); ctx.ellipse(-4.5, -36, 2.7, 2.2, 0.03, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(4.5, -36, 2.7, 2.2, -0.03, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = c.eyes;
      ctx.beginPath(); ctx.arc(-4.2, -35.8, 1.25, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4.8, -35.8, 1.25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(-3.8, -36.2, 0.45, 0, Math.PI * 2); ctx.fill();

  function drawGoblin(e) {
    const bob = e.mode === "climb" ? 0 : Math.sin(e.bob) * 2;

    const climbSwing = Math.sin(e.bob * 3.2) * 6;

    if (e.mode === "climb") {
      ctx.strokeStyle = "#4c9c4c";
      ctx.lineWidth = 5;

      ctx.beginPath();
      ctx.moveTo(-11, 4); ctx.lineTo(-18, -8 + climbSwing);

    }

    ctx.fillStyle = "#4c9c4c";
    ctx.beginPath(); ctx.moveTo(-18, -10); ctx.lineTo(-31, -18); ctx.lineTo(-21, 1); ctx.closePath(); ctx.fill();

      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-9, 25); ctx.lineTo(-12 + Math.sin(e.bob * 2) * 3, 33);
      ctx.moveTo(9, 25); ctx.lineTo(12 - Math.sin(e.bob * 2) * 3, 33);

    ctx.beginPath(); ctx.arc(-6, -8, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -8, 3, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#c7b0ff";
    ctx.beginPath(); ctx.arc(-9, 10, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, 10, 3, 0, Math.PI * 2); ctx.fill();

  function drawUnicorn(cx, groundY, facing = 1, phase = 0, flipAngle = 0, withRider = false) {

    ctx.fillStyle = white;

    ctx.beginPath(); ctx.moveTo(59, -104); ctx.lineTo(66, -123); ctx.lineTo(70, -102); ctx.closePath(); ctx.fill();
    ctx.fillStyle = white;
    ctx.beginPath(); ctx.moveTo(47, -105); ctx.lineTo(44, -119); ctx.lineTo(55, -105); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(61, -105); ctx.lineTo(65, -118); ctx.lineTo(68, -103); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pink;
